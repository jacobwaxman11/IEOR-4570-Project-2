<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NYC Rental Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://photos.zillowstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"></noscript>
    <link rel="stylesheet" href="/static/chat.css?v=12">
</head>
<body>
    <div class="app">
        <aside class="rail" id="rail">
            <div class="brand">
                <p class="brand-kicker">New York</p>
                <h1>NYC Rental Agent</h1>
            </div>
            <div class="tabs" role="tablist" aria-label="Chats and saved listings">
                <button type="button" role="tab" id="tab-chats" aria-selected="true" aria-controls="rail-body">Chats</button>
                <button type="button" role="tab" id="tab-saved" aria-selected="false" aria-controls="rail-body">Saved</button>
            </div>
            <div class="rail-body" id="rail-body"></div>
        </aside>
        <div class="scrim" id="scrim" hidden></div>
        <main class="main">
            <header class="top">
                <div class="wrap top-inner">
                    <button type="button" class="btn btn-quiet menu" id="menu">Menu</button>
                    <p class="top-title" id="top-title">New chat</p>
                </div>
            </header>
            <div class="log-scroll" id="log-scroll">
                <div class="wrap" id="log"></div>
            </div>
            <div class="composer">
                <form class="wrap" id="form">
                    <label class="sr" for="input">Message</label>
                    <textarea id="input" rows="1" placeholder="Ask about a neighborhood, a rent, or a building"></textarea>
                    <button type="submit" class="btn btn-primary" id="send">Send</button>
                </form>
            </div>
        </main>
    </div>
    <script src="/static/chat.js?v=12"></script>
</body>
</html>
