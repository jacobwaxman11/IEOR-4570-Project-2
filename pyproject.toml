[project]
name = "crypto-chatbot-agent"
version = "0.1.0"
description = "Crypto chatbot agent using qwen-tool-calling behind a web server: FastAPI + LiteLLM + Gemini, with tool calls shown in the UI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "python-dotenv>=1.2.3",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "curl-cffi>=0.17.0",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "google-genai>=2.24.0",
]
